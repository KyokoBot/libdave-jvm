name: Publish
on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
  release:
    types: [ published ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and Publish
        env:
          ORG_GRADLE_PROJECT_MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew build publish -x test --no-daemon

      - name: Upload api Artifact
        uses: actions/upload-artifact@v6
        with:
          name: api
          path: api/build/libs/api-*.jar

      - name: Upload impl-jni Artifact
        uses: actions/upload-artifact@v6
        with:
          name: impl-jni
          path: impl-jni/build/libs/impl-jni-*.jar

      - name: Upload impl-ffm Artifact
        uses: actions/upload-artifact@v6
        with:
          name: impl-ffm
          path: impl-ffm/build/libs/impl-ffm-*.jar

      - name: Upload adapter-jda Artifact
        uses: actions/upload-artifact@v6
        with:
          name: adapter-jda
          path: adapter-jda/build/libs/adapter-jda-*.jar
